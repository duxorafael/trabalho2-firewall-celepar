! ==============================================================================
! SCRIPT DE CONFIGURACAO CISCO IOS - GATEWAY / FIREWALL CELEPAR
! Disciplina: Redes de Computadores - 4º Período (IFPR)
! Autores: Alexandre, Beatriz e Maurício
! Equipamento: Cisco 1941 / 2911 / 2901 Router no Packet Tracer
! ==============================================================================

enable
configure terminal
hostname GW-FIREWALL-CELEPAR

! ------------------------------------------------------------------------------
! 1. EXCLUSAO DE ENDERECOS DHCP (IPs dos Gateways e Servidores)
! ------------------------------------------------------------------------------
ip dhcp excluded-address 10.0.10.1 10.0.10.20
ip dhcp excluded-address 10.0.20.1 10.0.20.20
ip dhcp excluded-address 10.0.30.1 10.0.30.10
ip dhcp excluded-address 10.0.40.1 10.0.40.10

! ------------------------------------------------------------------------------
! 2. ESCOPOS DE DHCP PARA ESTACOES E VISITANTES
! ------------------------------------------------------------------------------
ip dhcp pool POOL_ESTACOES_VLAN30
 network 10.0.30.0 255.255.255.0
 default-router 10.0.30.1
 dns-server 10.0.10.1 8.8.8.8
 domain-name celepar.local
exit

ip dhcp pool POOL_VISITANTES_VLAN40
 network 10.0.40.0 255.255.255.0
 default-router 10.0.40.1
 dns-server 8.8.8.8
 domain-name guest.local
exit

! ------------------------------------------------------------------------------
! 3. ACLS DE FIREWALL (Baseadas na Tabela 3 do Relatório)
! ------------------------------------------------------------------------------

! --- ACL PARA VLAN 40 (VISITANTES) ---
! Regra 1: Permitir apenas DNS (53), HTTP (80) e HTTPS (443)
! Regra 2: Bloquear qualquer acesso para toda a rede interna 10.0.0.0/8
ip access-list extended ACL_FIREWALL_VLAN40
 permit udp 10.0.40.0 0.0.0.255 any eq domain
 permit tcp 10.0.40.0 0.0.0.255 any eq domain
 permit tcp 10.0.40.0 0.0.0.255 any eq www
 permit tcp 10.0.40.0 0.0.0.255 any eq 443
 deny ip 10.0.40.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip any any
exit

! --- ACL PARA VLAN 30 (ESTACOES DE TRABALHO) ---
! Regra 5: Bloquear acesso para VLAN 10 (Gerencia 10.0.10.0/24)
! Regra 4: Permitir SMB (445) e IPP (631) para servidores na VLAN 20
! Bloquear qualquer outro acesso à VLAN 20
! Permitir saida para WAN / Internet
ip access-list extended ACL_FIREWALL_VLAN30
 deny ip 10.0.30.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit tcp 10.0.30.0 0.0.0.255 host 10.0.20.5 eq 445
 permit tcp 10.0.30.0 0.0.0.255 10.0.20.0 0.0.0.255 eq 631
 deny ip 10.0.30.0 0.0.0.255 10.0.20.0 0.0.0.255
 permit ip 10.0.30.0 0.0.0.255 any
exit

! --- ACL PARA VLAN 20 (SERVIDORES) ---
! Regra 5: Bloquear acesso para a VLAN 10 (Gerencia)
ip access-list extended ACL_FIREWALL_VLAN20
 deny ip 10.0.20.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit ip 10.0.20.0 0.0.0.255 any
exit

! ------------------------------------------------------------------------------
! 4. SUBINTERFACES 802.1Q (ROUTER-ON-A-STICK)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/0
 no shutdown
exit

! Subinterface VLAN 10 (Gerenciamento)
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.0.10.1 255.255.255.0
 no shutdown
exit

! Subinterface VLAN 20 (Servidores)
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.0.20.1 255.255.255.0
 ip access-group ACL_FIREWALL_VLAN20 in
 no shutdown
exit

! Subinterface VLAN 30 (Estacoes de Trabalho)
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.0.30.1 255.255.255.0
 ip access-group ACL_FIREWALL_VLAN30 in
 no shutdown
exit

! Subinterface VLAN 40 (Visitantes)
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 10.0.40.1 255.255.255.0
 ip access-group ACL_FIREWALL_VLAN40 in
 no shutdown
exit

! ------------------------------------------------------------------------------
! 5. INTERFACE WAN (CONEXAO COM PROVEDOR / INTERNET)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/1
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
exit

! Habilitar NAT Overload para saída interna
interface GigabitEthernet0/0.30
 ip nat inside
exit
interface GigabitEthernet0/0.40
 ip nat inside
exit

ip access-list standard ACL_NAT
 permit 10.0.30.0 0.0.0.255
 permit 10.0.40.0 0.0.0.255
exit

ip nat inside source list ACL_NAT interface GigabitEthernet0/1 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.1

end
write memory
